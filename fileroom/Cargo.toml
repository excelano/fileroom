[package]
name = "fileroom"
description = "Read and verify records under the Slipcase Records Profile: records, hold matters, aggregations, the disposition register, and the retention schedule"
homepage = "https://slipcaseformat.org/profiles/records"
readme = "README.md"
keywords = ["slipcase", "records", "retention", "disposition", "toml"]
categories = ["filesystem", "encoding"]
# The fixture-driven tests read the spec submodule, which a package does not carry.
exclude = ["tests/"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The `fileroom` command. Off by default so a library consumer does not build clap.
cli = ["dep:clap"]

[[bin]]
name = "fileroom"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
slpc = { version = "0.5", features = ["fs"] }
sha2 = "0.11"
csv = "1.4"
unicode-normalization = "0.1"
clap = { version = "4.6", features = ["derive", "env"], optional = true }

[dev-dependencies]
tempfile = "3.27"

[package.metadata.docs.rs]
all-features = true
