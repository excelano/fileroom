[package]
name = "fileroom"
description = "Read and verify records under the Slipcase Records Profile: records, hold matters, aggregations, the disposition register, and the retention schedule"
homepage = "https://slipcaseformat.org/profiles/records"
readme = "README.md"
keywords = ["slipcase", "records", "retention", "disposition", "toml"]
categories = ["filesystem", "encoding"]
# The fixture-driven tests read the spec submodule, which a package does not carry.
exclude = ["tests/"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The `fileroom` command. Off by default so a library consumer does not build clap.
cli = ["dep:clap"]
# Eligibility, plans, destruction and recovery: the only code that deletes.
# Off by default so a reader links nothing that can destroy.
dispose = ["dep:gethostname", "dep:slipql"]

[[bin]]
name = "fileroom"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
slpc = { version = "0.6", features = ["fs"] }
sha2 = "0.11"
csv = "1.4"
unicode-normalization = "0.1"
clap = { version = "4.6", features = ["derive", "env"], optional = true }
gethostname = { version = "1.1", optional = true }
slipql = { version = "0.2", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3.27"

[package.metadata.docs.rs]
all-features = true

[package.metadata.deb]
maintainer = "David M. Anderson <david.anderson@excelano.com>"
extended-description = """
fileroom reads and verifies records kept under the Slipcase Records Profile: a record's retention state and history, the organization's retention schedule, and the disposition register, so that any of them can be checked without a license and without a vendor.
Six verbs: show, log, check, schedule, register, and verify."""
section = "utils"
priority = "optional"
depends = "libc6, libgcc-s1"
features = ["cli"]
license-file = ["../LICENSE", "0"]
